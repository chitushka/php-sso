services:
  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-sso}
      POSTGRES_USER: ${POSTGRES_USER:-sso}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sso}
    ports:
      - "5433:5432"
    volumes:
      - postgres17_data:/var/lib/postgresql/data
      - tls_data:/tls:ro
    command: ["postgres", "-c", "ssl=on", "-c", "ssl_cert_file=/tls/server.crt", "-c", "ssl_key_file=/tls/server.key"]
    depends_on:
      tls-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sso} -d ${POSTGRES_DB:-sso}"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    image: sso-php-app:latest
    restart: unless-stopped
    env_file:
      - .env
    environment:
      SSO_ENV: ${SSO_ENV:-prod}
      SSO_DATABASE_URL: ${SSO_DATABASE_URL}
      SSO_CUTOVER_EXPECTED_ISSUER: ${SSO_CUTOVER_EXPECTED_ISSUER:-}
      SSO_MAINTENANCE_FILE: /cutover/maintenance
    volumes:
      - cutover_state:/cutover:ro
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      default:
      edge:

  web:
    build:
      context: .
      dockerfile: docker/nginx/Dockerfile
    image: sso-php-web:latest
    restart: unless-stopped
    ports:
      - "8080:8080"
    depends_on:
      - app
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/health/live >/dev/null"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      default:
      edge:

  migrate:
    image: sso-php-app:latest
    profiles: ["operations"]
    env_file: [.env]
    command: ["php", "yii", "migrate", "--interactive=0"]
    depends_on:
      postgres:
        condition: service_healthy

  tls-init:
    image: sso-php-app:latest
    restart: "no"
    volumes:
      - tls_data:/tls
    command: >-
      sh -lc "if [ ! -s /tls/server.crt ] || [ ! -s /tls/server.key ]; then
      openssl req -x509 -newkey rsa:2048 -sha256 -nodes -days 825
      -subj '/CN=localhost'
      -addext 'subjectAltName=DNS:localhost,DNS:postgres,IP:127.0.0.1'
      -keyout /tls/server.key -out /tls/server.crt;
      fi;
      chown 999:999 /tls/server.crt /tls/server.key;
      chmod 644 /tls/server.crt; chmod 600 /tls/server.key"

  https-proxy:
    image: nginx:1.27-alpine-slim
    restart: unless-stopped
    ports:
      - "8443:443"
    volumes:
      - ./docker/nginx/https.conf:/etc/nginx/conf.d/default.conf:ro
      - tls_data:/tls:ro
    depends_on:
      web:
        condition: service_started
      tls-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- --no-check-certificate https://127.0.0.1/health/live >/dev/null"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      edge:
        ipv4_address: 172.31.250.10

  rollback-rehearsal:
    image: postgres:17
    profiles:
      - cutover
    restart: "no"
    environment:
      PGHOST: postgres
      PGUSER: ${POSTGRES_USER:-sso}
      PGPASSWORD: ${POSTGRES_PASSWORD:-sso}
      SOURCE_DB: ${POSTGRES_DB:-sso}
    volumes:
      - ./docker/postgres/rehearse-rollback.sh:/usr/local/bin/rehearse-rollback:ro
    depends_on:
      postgres:
        condition: service_healthy
    entrypoint: ["/bin/sh", "/usr/local/bin/rehearse-rollback"]

  maintenance-on:
    image: sso-php-app:latest
    profiles:
      - cutover
    restart: "no"
    volumes:
      - cutover_state:/cutover
    command: ["/bin/sh", "-lc", "umask 077 && touch /cutover/maintenance && chmod 600 /cutover/maintenance"]

  maintenance-off:
    image: sso-php-app:latest
    profiles:
      - cutover
    restart: "no"
    volumes:
      - cutover_state:/cutover
    command: ["/bin/sh", "-lc", "rm -f /cutover/maintenance"]

  ldap-test:
    image: osixia/openldap:1.5.0
    command:
      - --copy-service
    profiles:
      - integration
    environment:
      LDAP_ORGANISATION: SSO Integration
      LDAP_DOMAIN: example.org
      LDAP_ADMIN_PASSWORD: admin-password
      LDAP_CONFIG_PASSWORD: config-password
      LDAP_TLS: "false"
    volumes:
      - ./tests/Fixtures/ldap:/container/service/slapd/assets/config/bootstrap/ldif/custom
    healthcheck:
      test:
        - CMD-SHELL
        - ldapsearch -x -H ldap://127.0.0.1:389 -D 'cn=admin,dc=example,dc=org' -w admin-password -b 'dc=example,dc=org' '(uid=fixture-user)' dn | grep -q 'uid=fixture-user'
      interval: 2s
      timeout: 5s
      retries: 20

volumes:
  postgres17_data:
  tls_data:
  cutover_state:

networks:
  edge:
    ipam:
      config:
        - subnet: 172.31.250.0/24
