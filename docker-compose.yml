services:
  postgres:
    image: postgres:13-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-sso}
      POSTGRES_USER: ${POSTGRES_USER:-sso}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sso}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sso} -d ${POSTGRES_DB:-sso}"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    env_file:
      - .env
    environment:
      SSO_CUTOVER_EXPECTED_ISSUER: ${SSO_CUTOVER_EXPECTED_ISSUER:-}
    ports:
      - "8080:8080"
    volumes:
      - .:/app
      - vendor_data:/app/vendor
    depends_on:
      postgres:
        condition: service_healthy
    command: sh -lc "composer install --no-interaction --prefer-dist && php yii migrate --interactive=0 && php -S 0.0.0.0:8080 -t web web/router.php"

  ldap-test:
    image: osixia/openldap:1.5.0
    command:
      - --copy-service
    profiles:
      - integration
    environment:
      LDAP_ORGANISATION: SSO Integration
      LDAP_DOMAIN: example.org
      LDAP_ADMIN_PASSWORD: admin-password
      LDAP_CONFIG_PASSWORD: config-password
      LDAP_TLS: "false"
    volumes:
      - ./tests/Fixtures/ldap:/container/service/slapd/assets/config/bootstrap/ldif/custom
    healthcheck:
      test:
        - CMD-SHELL
        - ldapsearch -x -H ldap://127.0.0.1:389 -D 'cn=admin,dc=example,dc=org' -w admin-password -b 'dc=example,dc=org' '(uid=fixture-user)' dn | grep -q 'uid=fixture-user'
      interval: 2s
      timeout: 5s
      retries: 20

volumes:
  postgres_data:
  vendor_data:
