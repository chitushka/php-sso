services:
  postgres:
    image: postgres:13-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-sso}
      POSTGRES_USER: ${POSTGRES_USER:-sso}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sso}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sso} -d ${POSTGRES_DB:-sso}"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    env_file:
      - .env
    environment:
      SSO_CUTOVER_EXPECTED_ISSUER: ${SSO_CUTOVER_EXPECTED_ISSUER:-}
    ports:
      - "8080:8080"
    volumes:
      - .:/app
      - vendor_data:/app/vendor
    depends_on:
      postgres:
        condition: service_healthy
    command: sh -lc "composer install --no-interaction --prefer-dist && php yii migrate --interactive=0 && php -S 0.0.0.0:8080 -t web web/router.php"
    networks:
      default:
      edge:

  tls-init:
    image: sso-php-app:latest
    restart: "no"
    volumes:
      - tls_data:/tls
    command: >-
      sh -lc "if [ ! -s /tls/server.crt ] || [ ! -s /tls/server.key ]; then
      openssl req -x509 -newkey rsa:2048 -sha256 -nodes -days 825
      -subj '/CN=localhost'
      -addext 'subjectAltName=DNS:localhost,IP:127.0.0.1'
      -keyout /tls/server.key -out /tls/server.crt;
      chmod 600 /tls/server.key; fi"

  https-proxy:
    image: nginx:1.27-alpine-slim
    restart: unless-stopped
    ports:
      - "8443:443"
    volumes:
      - ./docker/nginx/https.conf:/etc/nginx/conf.d/default.conf:ro
      - tls_data:/tls:ro
    depends_on:
      app:
        condition: service_started
      tls-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- --no-check-certificate https://127.0.0.1/health/live >/dev/null"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      edge:
        ipv4_address: 172.31.250.10

  ldap-test:
    image: osixia/openldap:1.5.0
    command:
      - --copy-service
    profiles:
      - integration
    environment:
      LDAP_ORGANISATION: SSO Integration
      LDAP_DOMAIN: example.org
      LDAP_ADMIN_PASSWORD: admin-password
      LDAP_CONFIG_PASSWORD: config-password
      LDAP_TLS: "false"
    volumes:
      - ./tests/Fixtures/ldap:/container/service/slapd/assets/config/bootstrap/ldif/custom
    healthcheck:
      test:
        - CMD-SHELL
        - ldapsearch -x -H ldap://127.0.0.1:389 -D 'cn=admin,dc=example,dc=org' -w admin-password -b 'dc=example,dc=org' '(uid=fixture-user)' dn | grep -q 'uid=fixture-user'
      interval: 2s
      timeout: 5s
      retries: 20

volumes:
  postgres_data:
  vendor_data:
  tls_data:

networks:
  edge:
    ipam:
      config:
        - subnet: 172.31.250.0/24
